[project]
name = "lampara"
version = "0.1.0"
description = "Tooling for the lampara-aliz voice-controlled lamp: dataset building, augmentation and Edge Impulse data management"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "soundfile>=0.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
lampara = "lampara.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/src/lampara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
